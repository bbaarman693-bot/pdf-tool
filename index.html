<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Tool</title>

<link rel="stylesheet" href="style.css">

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

</head>
<body>

<div class="container">

<h1>PDF Tool</h1>

<p>Welcome to PDF Tool</p>

<div class="buttons">

<button onclick="openTool('merge')">Merge PDF</button>

<button onclick="openTool('split')">Split PDF</button>

<button onclick="openTool('compress')">Compress PDF</button>

<button onclick="openTool('imgpdf')">Image to PDF</button>

<button onclick="openTool('pdfimg')">PDF to Image</button>

</div>

<!-- Merge PDF -->

<div id="merge" class="tool">

<h2>Merge PDF</h2>

<input type="file" id="pdfInput" accept=".pdf" multiple hidden>

<button id="addPdf">Add PDF</button>

<div id="fileList"></div>

<button id="mergeBtn">Merge PDF</button>
<button id="downloadBtn" style="display:none;">
    Download Merged PDF
</button>
</div>

<!-- Split PDF -->

<div id="split" class="tool">

<h2>Split PDF</h2>

<input type="file" id="splitPdfInput" accept=".pdf" hidden>

<button id="selectSplitPdf">Select PDF</button>

<p id="splitFileName">No PDF selected</p>

<label for="pageRange">Enter Page Range</label>

<input
    type="text"
    id="pageRange"
    placeholder="Examples: 1 | 1-3 | 2-5 | 4-10">
    style="padding:10px;width:220px;border-radius:6px;"
>

<br><br>

<button id="splitBtn">Split PDF</button>

<button id="downloadSplitBtn" style="display:none;">
    Download Split PDF
</button>

</div>

<!-- Compress -->

<div id="compress" class="tool">

<h2>Compress PDF</h2>

<p>Coming Soon...</p>

</div>

<!-- Image to PDF -->

<div id="imgpdf" class="tool">

<h2>Image to PDF</h2>

<p>Coming Soon...</p>

</div>

<!-- PDF to Image -->

<div id="pdfimg" class="tool">

<h2>PDF to Image</h2>

<p>Coming Soon...</p>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
